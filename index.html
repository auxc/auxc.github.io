<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
<style>
html {
  box-sizing: border-box;
  width: 100%;
  overflow-y: scroll;
  scrollbar-gutter: stable;
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  font-family: Roboto, sans-serif;
  margin: 0;
  background: #f6f7f8;
  color: rgb(0 0 0 / 0.88);
}

li:nth-child(even) {
  background: rgb(0 0 0 / 0.005);
}

li {
  margin-bottom: 15px;
}

#appHeader {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #fafafa;
  border-bottom: 1px solid rgb(0 0 0 / 0.12);
  box-shadow: 0 1px 4px rgb(0 0 0 / 0.06);
}

.headerInner,
.main-content {
  width: min(1100px, calc(100% - 24px));
  margin: 0 auto;
}

.headerInner {
  --search-border-color: rgb(0 0 0 / 0.7);
  padding: 12px 0 10px;
}

.headerMetaRow {
  display: flex;
  justify-content: center;
  margin-bottom: 10px;
}

.headerTopRow {
  display: flex;
  align-items: stretch;
  gap: 12px;
}

.searchShell {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1 1 auto;
  min-width: 0;
}

.searchTools {
  --search-control-height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.searchContainer {
  display: flex;
  align-items: stretch;
  position: relative;
  height: var(--search-control-height);
  min-height: var(--search-control-height);
  margin: 0;
  white-space: nowrap;
  gap: 0;
  flex: 1 1 auto;
}

#searchInput {
  flex-grow: 1;
  min-width: 8ch;
  padding: 8px 40px 8px 12px;
  font-size: 15px;
  border: 1px solid var(--search-border-color);
  border-left: 0;
  box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
  border-radius: 0;
  border-top-right-radius: 6px;
}

#searchInput:focus {
  outline: none;
  box-shadow: inset 0 0 3.5px rgb(0 0 0 / 0.133);
}

.searchClearButton {
  display: inline-flex;
  flex: 0 0 var(--search-control-height);
  align-items: center;
  justify-content: center;
  width: var(--search-control-height);
  height: 100%;
  padding: 0 0 2px;
  color: rgb(0 0 0 / 0.66);
  font: inherit;
  font-size: 20px;
  line-height: 1;
  background: #f8f9fa;
  border: 1px solid var(--search-border-color);
  border-left: 0;
  border-radius: 0;
  border-top-right-radius: 6px;
  box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
  cursor: pointer;
}

.searchClearButton:hover,
.searchClearButton:focus-visible {
  color: rgb(0 0 0 / 0.9);
  background: #eceff1;
  outline: none;
}

.searchClearButton[hidden] {
  display: none;
}

.searchContainer.hasClearableQuery #searchInput {
  border-top-right-radius: 0;
}

.searchBuildIndicator {
  position: absolute;
  top: 50%;
  right: calc(var(--search-control-height) + 13px);
  width: 16px;
  height: 16px;
  transform: translateY(-50%);
  pointer-events: none;
}

.searchContainer:not(.hasClearableQuery) .searchBuildIndicator {
  right: 13px;
}

.searchBuildIndicator[hidden] {
  display: none;
}

.searchBuildSpinner {
  display: block;
  box-sizing: border-box;
  width: 16px;
  height: 16px;
  border: 2px solid rgb(0 0 0 / 0.16);
  border-top-color: rgb(0 0 0 / 0.7);
  border-radius: 50%;
  animation: spin 0.55s linear infinite;
}

.visuallyHidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

#searchContainerId {
  display: flex;
  flex: 0 1 auto;
  align-items: stretch;
  max-width: 60%;
  min-width: 0;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  border-top: 1px solid var(--search-border-color);
  border-bottom: 1px solid var(--search-border-color);
  box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
  scrollbar-width: none;
}

#searchContainerId::-webkit-scrollbar {
  display: none;
}

#searchContainerId:empty {
  display: none;
}

.tagPanel {
  --tag-pill-height: 29px;
  --tag-row-gap: 8px;
  --tag-drawer-height: 35px;
  --tag-expanded-max-height: min(280px, 40vh);
  position: relative;
  overflow: hidden;
  height: var(--tag-drawer-height);
  opacity: 1;
  margin: 6px 0;
  padding: 4px 0 2px;
  contain: layout paint;
}

.tagPanel.hasMoreTags {
  padding-right: 72px;
}

.tagPanel.tagPanelExpanded {
  height: auto;
  min-height: var(--tag-drawer-height);
  max-height: var(--tag-expanded-max-height);
}

.tagPanel.tagPanelEmpty {
  height: 0;
  min-height: 0;
  max-height: 0;
  margin-top: 0;
  margin-bottom: 0;
  padding-top: 0;
  padding-bottom: 0;
}

.tagListViewport {
  height: 100%;
  overflow: hidden;
}

.tagPanel.tagPanelExpanded .tagListViewport {
  height: auto;
  max-height: calc(var(--tag-expanded-max-height) - 6px);
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  scrollbar-width: none;
}

.tagListViewport::-webkit-scrollbar {
  display: none;
}

.tagListViewport:focus-visible {
  outline: 1px solid rgb(0 0 0 / 0.28);
  outline-offset: -1px;
}

.tagScrollTrack {
  position: absolute;
  top: calc(4px + var(--tag-pill-height) + var(--tag-row-gap));
  right: 3px;
  bottom: 3px;
  z-index: 2;
  width: 6px;
  min-height: 24px;
  overflow: hidden;
  background: rgb(0 0 0 / 0.08);
  border: 1px solid rgb(0 0 0 / 0.08);
  border-radius: 999px;
  touch-action: none;
}

.tagScrollTrack[hidden] {
  display: none;
}

.tagScrollThumb {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 20px;
  background: linear-gradient(180deg, rgb(0 0 0 / 0.58), rgb(0 0 0 / 0.34));
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2);
  transform: translateY(0);
}

.tagScrollThumb:hover {
  background: linear-gradient(180deg, rgb(0 0 0 / 0.72), rgb(0 0 0 / 0.46));
}

#tagBox {
  list-style-type: none;
  display: flex;
  flex-wrap: wrap;
  gap: var(--tag-row-gap) 10px;
  padding: 0;
  margin: 0;
}

.tagMoreButton {
  position: absolute;
  top: 4px;
  right: 0;
  z-index: 1;
  box-sizing: border-box;
  width: 52px;
  height: var(--tag-pill-height);
  padding: 4px 9px;
  color: rgb(0 0 0 / 0.72);
  font: inherit;
  font-size: 13px;
  line-height: 1;
  background: linear-gradient(180deg, #fff 0%, #f1f3f4 52%, #dfe3e6 100%);
  border: 1px solid var(--search-border-color);
  border-radius: 0 0 6px 6px;
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 0.9),
    inset 0 -1px 1px rgb(0 0 0 / 0.16),
    -10px 0 12px #fafafa;
  cursor: pointer;
}

.tagMoreButton:hover,
.tagMoreButton:focus-visible {
  color: rgb(0 0 0 / 0.9);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 1),
    inset 0 -1px 1px rgb(0 0 0 / 0.18),
    -10px 0 12px #fafafa;
  outline: none;
}

.tagMoreButton:active,
.tagMoreButton[aria-expanded="true"] {
  box-shadow:
    inset 0 2px 3px rgb(0 0 0 / 0.2),
    inset 0 -1px 0 rgb(255 255 255 / 0.55),
    -10px 0 12px #fafafa;
}

.tagMoreButton[hidden] {
  display: none;
}

#videoBox {
  list-style-type: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

#results {
  list-style-type: none;
  padding-left: 0;
  margin: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.resultItem {
  margin-bottom: 8px;
  padding: 4px 6px;
  border-radius: 10px;
  scroll-margin-top: 96px;
  content-visibility: auto;
  contain-intrinsic-size: auto 96px;
}

.resultItem.is-selected {
  background: linear-gradient(180deg, rgba(11, 178, 255, 0.01), rgba(11, 178, 255, 0.05));
  box-shadow:
    inset 0 0 0 1px rgb(26 115 232 / 0.42),
    inset 0 0 0 2px rgb(255 255 255 / 0.55);
}

.resultItem.is-selected a {
  text-decoration: underline;
}

#results a,
#results small,
#results sup,
#output {
  overflow-wrap: anywhere;
  word-break: break-word;
}

.main-content {
  overflow: visible;
  padding: 16px 0 24px;
}

#output {
  font-family: monospace;
  display: inline-block;
  text-align: center;
  color: rgb(0 0 0 / 0.65);
  text-shadow: 0 1px 1px rgb(255 255 255 / 0.85);
  font-size: 12px;
  line-height: 1.3;
  padding: 0;
}

.footerLink {
  color: rgb(0 0 0 / 0.8);
}

.tagLink {
  white-space: nowrap;
  text-decoration: none;
  color: rgb(255 255 255);
  text-shadow: 0 1px 3px rgb(64 64 64);
  font-weight: 500;
  font-size: 14px;
  line-height: 1.35;
  border: 1px solid rgb(0 0 0 / 0.3);
  border-radius: 0 0 6px 6px;
  box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
  height: var(--tag-pill-height);
  padding: 4px 7px;
  display: inline-flex;
  align-items: center;
}

.tagCounter {
  color: rgb(255 255 255);
  text-decoration: none;
  text-shadow: 0 2px 50px rgba(220 220 220 255);
  margin-left: 8px;
  padding: 0 2px;
}

.tagSearchPill {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  white-space: nowrap;
  text-decoration: none;
  color: rgb(255 255 255);
  text-shadow: 0 1px 3px rgb(64 64 64);
  font-weight: 700;
  border: 0;
  border-right: 1px solid rgb(0 0 0 / 0.3);
  height: 100%;
  padding: 0 9px;
  border-radius: 0;
  margin: 0;
  cursor: pointer;
}

.mainDropdown {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  background: linear-gradient(180deg, #fff 0%, #f1f3f4 52%, #dfe3e6 100%);
  border-radius: 0;
  border-top-left-radius: 6px;
  border: 1px double var(--search-border-color);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 0.9),
    inset 0 -1px 1px rgb(0 0 0 / 0.16),
    0 2px 4px rgb(0 0 0 / 0.14);
  min-width: 52px;
  cursor: pointer;
}

.mainDropdown:hover,
.mainDropdown:focus-visible {
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 1),
    inset 0 -1px 1px rgb(0 0 0 / 0.18),
    0 3px 6px rgb(0 0 0 / 0.18);
  outline: none;
}

.mainDropdown:active,
.mainDropdown[aria-expanded="true"] {
  box-shadow:
    inset 0 2px 3px rgb(0 0 0 / 0.2),
    inset 0 -1px 0 rgb(255 255 255 / 0.55),
    0 1px 2px rgb(0 0 0 / 0.12);
}

.mainButtonIcon,
.mainMenuItemIcon {
  display: block;
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  object-fit: contain;
  filter: drop-shadow(0 0 1.5px rgb(0 0 0 / 0.28));
}

.mainMenu {
  position: static;
  display: flex;
  align-items: stretch;
  flex: 0 0 auto;
}

.mainMenuPanel {
  position: absolute;
  top: calc(100% - 1px);
  left: 0;
  right: 0;
  z-index: 60;
  display: block;
  width: auto;
  min-width: 0;
  max-width: none;
  padding: 7px;
  overflow: hidden;
  white-space: normal;
  background: #fafafa;
  border: 1px solid var(--search-border-color);
  border-radius: 0;
  box-shadow: 0 10px 24px rgb(0 0 0 / 0.16);
}

.mainMenuPanel[hidden] {
  display: none;
}

.searchContainer.mainMenuOpen {
  z-index: 70;
}

.mainMenuItem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  color: rgb(0 0 0 / 0.78);
  font: inherit;
  font-size: 13px;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.mainMenuItem:hover,
.mainMenuItem:focus-visible {
  outline: none;
}

.mainMenuItem:hover > span,
.mainMenuItem:focus-visible > span {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.mainDropdownIdleAnim {
  background:
   linear-gradient(rgba(255, 0, 0, 1) 0%, rgba(255, 154, 0, 1) 10%, rgba(208, 222, 33, 1) 20%, rgba(79, 220, 74, 1) 30%, rgba(63, 218, 216, 1) 40%, rgba(47, 201, 226, 1) 50%, rgba(28, 127, 238, 1) 60%, rgba(95, 21, 242, 1) 70%, rgba(186, 12, 248, 1) 80%, rgba(251, 7, 217, 1) 90%, rgba(255, 0, 0, 1) 100%)
   0 0 / 100% 200%;
  animation: rainbow 10s linear infinite;
  animation-direction: forward;
}

.extraResultContent {
  background: linear-gradient(rgba(32, 32, 32, 0.9) 0%, rgba(0, 0, 0, 1) 10%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0) 100%);
  width: min(100%, 560px);
  max-width: 100%;
  max-height: 100%;
  margin-top: 8px;
  border-radius: 16px;
}

.videoModal {
  width: min(100%, 560px);
  max-width: 100%;
}

.videoShowAnim {
  animation: fadeIn 0.3s cubic-bezier(0.32, 0, 0.67, 0);
}

.videoButton {
  border-radius: 8px;
  border: 1px solid rgb(0 0 0 / 0.4);
  padding-bottom: 3.5px;
  position: relative;
  top: -2px;
  margin-left: 3px;
}

.videoButton:active {
  animation: pressDown 0.066s cubic-bezier(0.33, 1, 0.68, 1) 1;
}

.videoCloseButton {
  float: right;
  border-radius: 16px;
  background-color: transparent;
  color: rgb(255 255 255);
  border: 1px solid rgb(0 0 0 / 0.01);
}

.modal-bar {
  align-items: center;
  padding: 8px 0 12px;
  width: 100%;
  box-sizing: border-box;
}

.modal-bar.hidden {
  display: none;
}

.dropdown {
  position: relative;
  display: inline-block;
}

.dropbtn {
  background-color: #f8f9fa;
  padding: 4px 8px;
  font-size: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

.dropbtn:hover {
  background-color: #e9ecef;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #fff;
  min-width: 120px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  border: 1px solid #ddd;
  border-radius: 3px;
  z-index: 1;
}

.dropdown-content a {
  color: #333;
  padding: 6px 8px;
  text-decoration: none;
  display: block;
  font-size: 12px;
  transition: background-color 0.2s ease;
}

.dropdown-content a:hover {
  background-color: #f1f1f1;
}

.dropdown:hover .dropdown-content {
  display: block;
}

.dropbtn::after {
  content: '\25BC';
  font-size: 8px;
  margin-left: 4px;
}

.videoModal iframe {
  width: min(100%, 560px);
  max-width: 100%;
  aspect-ratio: 16 / 9;
  height: auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pressDown {
  0% {
    transform: scale(1);
  }

  100% {
    transform: scale(0.8);
  }
}

@keyframes rainbow {
  to { background-position: 0 -200%; }
}

@keyframes fadeIn {
  0% { opacity: 0; }
  16% { opacity: 0; }
  100% { opacity: 1; }
}

@media (max-width: 720px) {
  .headerInner,
  .main-content {
    width: calc(100% - 16px);
  }

  .headerTopRow {
    align-items: stretch;
  }

  .searchTools {
    flex-wrap: wrap;
  }

  .searchContainer {
    width: 100%;
  }

  #output {
    width: 100%;
  }

}
</style>

  var aliases = [term];
  if (term.includes('.') || term.includes('-')) {
    term.split(/[.-]+/).forEach(function(part) {
      if (part.length >= 2)
        aliases.push(part);
    });

    var joined = term.replace(/[.-]+/g, '');
    if (joined)
      aliases.push(joined);
  }

  return Array.from(new Set(aliases));
}

function getMiniSearchOptions() {
  return {
    fields: MINI_SEARCH_FIELDS,
    tokenize: tokenizeSearchText,
    processTerm: processSearchTerm
  };
}

function getSearchSourceFingerprint(text) {
  var hash = 2166136261;

  for (var i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }

  return MINI_SEARCH_CACHE_VERSION + ':' + text.length + ':' + (hash >>> 0).toString(16);
}

function clearMiniSearchCache() {
  try {
    localStorage.removeItem(MINI_SEARCH_CACHE_SOURCE_KEY);
    localStorage.removeItem(MINI_SEARCH_CACHE_INDEX_KEY);
  } catch (error) {
    console.warn('Unable to clear the MiniSearch cache.', error);
  }
}

function beginSearchBuild(message) {
  var operation = ++searchBuildOperation;
  var indicator = document.getElementById('searchBuildIndicator');
  var status = document.getElementById('searchBuildStatus');
  var shell = document.querySelector('.searchShell');

  clearTimeout(searchBuildIndicatorTimer);
  clearTimeout(searchBuildStatusTimer);

  indicator.hidden = true;
  indicator.title = message;
  status.textContent = message;
  shell.setAttribute('aria-busy', 'true');

  searchBuildIndicatorTimer = setTimeout(function() {
    if (operation === searchBuildOperation)
      indicator.hidden = false;
  }, 180);

  return operation;
}

function finishSearchBuild(operation, message) {
  if (operation !== searchBuildOperation)
    return;

  var indicator = document.getElementById('searchBuildIndicator');
  var status = document.getElementById('searchBuildStatus');
  var shell = document.querySelector('.searchShell');

  clearTimeout(searchBuildIndicatorTimer);
  indicator.hidden = true;
  indicator.removeAttribute('title');
  shell.removeAttribute('aria-busy');
  status.textContent = message;

  clearTimeout(searchBuildStatusTimer);
  searchBuildStatusTimer = setTimeout(function() {
    if (operation === searchBuildOperation)
      status.textContent = '';
  }, 1500);
}

function updateSearchBuildMessage(operation, message) {
  if (operation !== searchBuildOperation)
    return;

  var indicator = document.getElementById('searchBuildIndicator');
  indicator.title = message;
  document.getElementById('searchBuildStatus').textContent = message;
}

async function initializeMiniSearch(documents, sourceText) {
  if (typeof MiniSearch === 'undefined')
    throw new Error('MiniSearch failed to load.');

  var options = getMiniSearchOptions();
  var sourceFingerprint = getSearchSourceFingerprint(sourceText);
  var cachedSource = null;
  var cachedIndex = null;

  try {
    cachedSource = localStorage.getItem(MINI_SEARCH_CACHE_SOURCE_KEY);
    cachedIndex = localStorage.getItem(MINI_SEARCH_CACHE_INDEX_KEY);
  } catch (error) {
    console.warn('Unable to read the MiniSearch cache; rebuilding it.', error);
  }

  if (cachedSource === sourceFingerprint && cachedIndex) {
    try {
      var loadedIndex = await MiniSearch.loadJSONAsync(cachedIndex, options);
      if (loadedIndex.documentCount === documents.length) {
        return {
          index: loadedIndex,
          fingerprint: sourceFingerprint,
          serializedIndex: cachedIndex
        };
      }
    } catch (error) {
      console.warn('Unable to load the MiniSearch cache; rebuilding it.', error);
      clearMiniSearchCache();
    }
  }

  var builtIndex = new MiniSearch(options);
  await builtIndex.addAllAsync(documents, { chunkSize: 25 });

  return {
    index: builtIndex,
    fingerprint: sourceFingerprint,
    serializedIndex: null
  };
}

function parseSearchDocuments(sourceText) {
  var documents = [];

  sourceText.split(/\r?\n/).forEach(function(line) {
    if (!line)
      return;

    var document = parseSearchDocument(line, documents.length);
    if (document)
      documents.push(document);
  });

  return documents;
}

function createSearchState(sourceText) {
  return {
    sourceText: sourceText,
    fingerprint: null,
    documents: parseSearchDocuments(sourceText),
    index: null,
    serializedIndex: null
  };
}

function persistSearchState(state) {
  try {
    var serializedIndex = state.serializedIndex || JSON.stringify(state.index);
    localStorage.setItem(MINI_SEARCH_CACHE_INDEX_KEY, serializedIndex);
    localStorage.setItem(MINI_SEARCH_CACHE_SOURCE_KEY, state.fingerprint);
    localStorage.setItem('cacheddb', state.sourceText);
  } catch (error) {
    console.warn('Unable to persist the search cache; using the in-memory index.', error);
  }
}

function cancelScheduledSearchStatePersistence() {
  if (searchCachePersistIdleHandle !== null && typeof cancelIdleCallback === 'function')
    cancelIdleCallback(searchCachePersistIdleHandle);

  clearTimeout(searchCachePersistTimeoutHandle);
  searchCachePersistIdleHandle = null;
  searchCachePersistTimeoutHandle = null;
}

function scheduleSearchStatePersistence(state) {
  cancelScheduledSearchStatePersistence();

  var persist = function() {
    searchCachePersistIdleHandle = null;
    searchCachePersistTimeoutHandle = null;

    if (activeSearch === state && state.index)
      persistSearchState(state);
  };

  if (typeof requestIdleCallback === 'function') {
    searchCachePersistIdleHandle = requestIdleCallback(persist, { timeout: 1500 });
  } else {
    searchCachePersistTimeoutHandle = setTimeout(persist, 0);
  }
}

function yieldForInitialSearchRender() {
  return new Promise(function(resolve) {
    if (document.visibilityState === 'hidden' || typeof requestAnimationFrame !== 'function') {
      setTimeout(resolve, 0);
      return;
    }

    requestAnimationFrame(function() {
      setTimeout(resolve, 0);
    });
  });
}

function activateSearchDocuments(state) {
  cancelScheduledSearchStatePersistence();
  activeSearch = state;
  storedText = state.sourceText;
  searchDocuments = state.documents;
  miniSearch = null;
  allTags.clear();
  tagColorMap.clear();
  globalCategoryMap.clear();
  document.getElementById('indexMeta').innerHTML = ' &middot; <a class="footerLink" href="searchdb.txt">index(' + searchDocuments.length + ')</a>';

  updateResults(false, false, true);
}

function activateSearchIndex(state, initialized) {
  if (activeSearch !== state)
    return false;

  state.fingerprint = initialized.fingerprint;
  state.index = initialized.index;
  state.serializedIndex = initialized.serializedIndex;
  miniSearch = state.index;

  if (document.getElementById('searchInput').value.trim() || globalTags.length > 0)
    updateResults(false);

  scheduleSearchStatePersistence(state);
  return true;
}

async function buildAndActivateSearch(sourceText, message, existingOperation) {
  var operation = existingOperation || beginSearchBuild(message);
  var hadActiveSearch = activeSearch !== null;
  var state;

  if (existingOperation)
    updateSearchBuildMessage(operation, message);

  try {
    state = createSearchState(sourceText);
    activateSearchDocuments(state);
    await yieldForInitialSearchRender();
    var initialized = await initializeMiniSearch(state.documents, state.sourceText);
    if (!activateSearchIndex(state, initialized))
      return false;

    finishSearchBuild(operation, hadActiveSearch ? 'Search updated.' : 'Search ready.');
    return true;
  } catch (error) {
    console.error('Unable to prepare search.', error);
    finishSearchBuild(
      operation,
      hadActiveSearch ? 'Search update failed. Using unindexed results.' : 'Search index is unavailable.'
    );
    return false;
  }
}

function parseSearchDocument(rawLine, id) {
  var resultWords = rawLine.match(splitWordsExp);
  if (!resultWords || resultWords.length < 6)
    return null;

  var values = resultWords.map(function(value) {
    return stripParentheses(value, ['(', ')']);
  });
  var categories = values[CATEGORY] || '';
  var keywords = values[KEYWORDS] || '';

  return {
    id: id,
    raw: rawLine,
    url: values[URL] || '',
    name: values[NAME] || '',
    description: values[DESCRIPTION] || '',
    categories: categories,
    categoryList: categories.split(/\s+/).filter(Boolean),
    keywords: keywords,
    timestamp: parseInt(values[TIMESTAMP]) || 0,
    archiveUrl: values[ARCHIVE_URL] || null
  };
}

function getFuzzyDistance(term) {
  var length = Array.from(term).length;

  if (length < 4 || /[+#]/.test(term) || term.startsWith('.'))
    return false;

  return length < 6 ? 1 : 2;
}

function getQuotedSearchPhrases(searchText) {
  var phrases = [];
  var phraseExp = /"([^"]+)"/g;
  var match;

  while ((match = phraseExp.exec(searchText)) !== null) {
    var phrase = normalizeSearchText(match[1]).trim();
    if (phrase)
      phrases.push(phrase);
  }

  return phrases;
}

function documentMatchesPhrases(document, phrases) {
  if (phrases.length == 0)
    return true;

  var normalizedFields = [
    document.name,
    document.description,
    document.categories,
    document.keywords
  ].map(normalizeSearchText);

  return phrases.every(function(phrase) {
    return normalizedFields.some(function(field) {
      return field.includes(phrase);
    });
  });
}

function documentHasTags(document, tags) {
  return tags.every(function(tag) {
    return document.categoryList.includes(tag);
  });
}

function cancelScheduledSearchInputUpdate() {
  clearTimeout(searchInputDebounceTimer);
  searchInputDebounceTimer = null;
}

function cancelProgressiveRenderWork() {
  progressiveRenderGeneration++;

  if (progressiveRenderIdleHandle !== null && typeof cancelIdleCallback === 'function')
    cancelIdleCallback(progressiveRenderIdleHandle);

  clearTimeout(progressiveRenderTimeoutHandle);
  progressiveRenderIdleHandle = null;
  progressiveRenderTimeoutHandle = null;
  progressiveRenderJobs.length = 0;
  return progressiveRenderGeneration;
}

function scheduleSearchInputUpdate() {

  cancelScheduledSearchInputUpdate();
  document.getElementById('results').setAttribute('aria-busy', 'true');

  searchInputDebounceTimer = setTimeout(function() {

    updateResults(false, true);

  searchInputIsComposing = true;
  cancelScheduledSearchInputUpdate();
  cancelProgressiveRenderWork();
}

function onSearchInputCompositionEnd() {
  searchInputIsComposing = false;
  scheduleSearchInputUpdate();
}

  var input = document.getElementById('searchInput');
  input.addEventListener('input', scheduleSearchInputUpdate);
  input.addEventListener('keydown', onSearchInputKeyDown);
  input.addEventListener('compositionstart', onSearchInputCompositionStart);
  input.addEventListener('compositionend', onSearchInputCompositionEnd);
  document.getElementById('clearSearchButton').addEventListener('click', resetSearch);
  document.getElementById('tagMoreButton').addEventListener('click', function() {
    var panel = document.getElementById('tagPanel');
    var shouldExpand = !panel.classList.contains('tagPanelExpanded');
    setTagPanelExpanded(shouldExpand);
    if (!shouldExpand)
      refreshTagMoreButton();
  });
  initTagScrollStrip();
  document.addEventListener('keydown', onGlobalShortcutKeyDown);

  initMainMenu();

  window.addEventListener('resize', function() {
    clearTimeout(tagPanelResizeTimer);
    tagPanelResizeTimer = setTimeout(refreshTagMoreButton, 100);
  });

  window.addEventListener('popstate', function() {
    grabTagsFromURL();
    grabSearchFromURL();
    grabSelectedResultFromURL();
    updateResults(false);
  });

  initModalBar();
  grabTagsFromURL();
  grabSearchFromURL();
  grabSelectedResultFromURL();
  shouldScrollSelectedResultOnInitialLoad = selectedResultUrl !== null;

  var cachedText = null;
  try {
    cachedText = localStorage.getItem('cacheddb');
  } catch (error) {
    console.warn('Unable to read the cached search database.', error);
  }

  var coldLoadOperation = cachedText ? null : beginSearchBuild('Loading search data.');
  var fetchPromise = fetch(url).then(function(response) {
    if (!response.ok)
      throw new Error('Search database request failed with status ' + response.status + '.');

    return response.text();
  }).then(function(text) {
    return { text: text, error: null };
  }).catch(function(error) {
    return { text: null, error: error };
  });

  if (cachedText)
    await buildAndActivateSearch(cachedText, 'Preparing search.');

  try {
    var fetchResult = await fetchPromise;
    if (fetchResult.error)
      throw fetchResult.error;

    var fetchedText = fetchResult.text;

    if (activeSearch && activeSearch.sourceText === fetchedText)
      return;

    await buildAndActivateSearch(
      fetchedText,
      activeSearch ? 'Updating search.' : 'Preparing search.',
      coldLoadOperation
    );
  } catch (error) {
    console.warn('Unable to refresh the search database.', error);

    if (coldLoadOperation)
      finishSearchBuild(coldLoadOperation, 'Search is unavailable.');
  }
}

function initTagScrollStrip() {
  var panel = document.getElementById('tagPanel');
  var viewport = document.getElementById('tagListViewport');
  var track = document.getElementById('tagScrollTrack');
  var thumb = document.getElementById('tagScrollThumb');

  viewport.addEventListener('scroll', scheduleTagScrollStripRefresh, { passive: true });

  panel.addEventListener('wheel', function(event) {
    if (
      event.ctrlKey ||
      !panel.classList.contains('tagPanelExpanded') ||
      viewport.scrollHeight <= viewport.clientHeight + 1 ||
      event.deltaY === 0
    )
      return;

    var deltaY = event.deltaY;
    if (event.deltaMode === WheelEvent.DOM_DELTA_LINE)
      deltaY *= 16;
    else if (event.deltaMode === WheelEvent.DOM_DELTA_PAGE)
      deltaY *= viewport.clientHeight;

    viewport.scrollTop += deltaY;
    event.preventDefault();
  }, { passive: false });

  track.addEventListener('pointerdown', function(event) {
    if (track.hidden)
      return;

    var thumbRect = thumb.getBoundingClientRect();
    tagScrollDrag = {
      pointerId: event.pointerId,
      offsetY: event.target === thumb
        ? event.clientY - thumbRect.top
        : thumbRect.height / 2
    };

    track.setPointerCapture(event.pointerId);
    updateTagScrollFromPointer(event);
    event.preventDefault();
  });

  track.addEventListener('pointermove', function(event) {
    if (!tagScrollDrag || event.pointerId !== tagScrollDrag.pointerId)
      return;

    updateTagScrollFromPointer(event);
    event.preventDefault();
  });

  var finishDrag = function(event) {
    if (!tagScrollDrag || event.pointerId !== tagScrollDrag.pointerId)
      return;

    tagScrollDrag = null;
  };

  track.addEventListener('pointerup', finishDrag);
  track.addEventListener('pointercancel', finishDrag);
  track.addEventListener('lostpointercapture', finishDrag);
}

function updateTagScrollFromPointer(event) {
  var viewport = document.getElementById('tagListViewport');
  var track = document.getElementById('tagScrollTrack');
  var thumb = document.getElementById('tagScrollThumb');
  var trackRect = track.getBoundingClientRect();
  var thumbHeight = thumb.offsetHeight;
  var maxThumbTravel = Math.max(0, trackRect.height - thumbHeight);
  var requestedTop = event.clientY - trackRect.top - tagScrollDrag.offsetY;
  var thumbTop = Math.max(0, Math.min(maxThumbTravel, requestedTop));
  var maxScroll = Math.max(0, viewport.scrollHeight - viewport.clientHeight);

  viewport.scrollTop = maxThumbTravel > 0
    ? (thumbTop / maxThumbTravel) * maxScroll
    : 0;
}

function scheduleTagScrollStripRefresh() {
  if (tagScrollFrame !== null)
    return;

  tagScrollFrame = window.requestAnimationFrame(function() {
    tagScrollFrame = null;
    refreshTagScrollStrip();
  });
}

function refreshTagScrollStrip() {
  var panel = document.getElementById('tagPanel');
  var viewport = document.getElementById('tagListViewport');
  var track = document.getElementById('tagScrollTrack');
  var thumb = document.getElementById('tagScrollThumb');
  var maxScroll = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
  var shouldShow = panel.classList.contains('tagPanelExpanded') && maxScroll > 1;

  track.hidden = !shouldShow;
  if (!shouldShow)
    return;

  var trackHeight = track.clientHeight;
  var thumbHeight = Math.max(
    20,
    Math.min(trackHeight, Math.round(trackHeight * viewport.clientHeight / viewport.scrollHeight))
  );
  var maxThumbTravel = Math.max(0, trackHeight - thumbHeight);
  var thumbTop = maxScroll > 0
    ? Math.round((viewport.scrollTop / maxScroll) * maxThumbTravel)
    : 0;

  thumb.style.height = thumbHeight + 'px';
  thumb.style.transform = 'translateY(' + thumbTop + 'px)';
}

function refreshTagMoreButton() {
  var panel = document.getElementById('tagPanel');
  var tagList = document.getElementById('tagBox');
  var button = document.getElementById('tagMoreButton');
  var wasExpanded = panel.classList.contains('tagPanelExpanded');
  var isEmpty = tagList.childElementCount === 0;

  panel.classList.toggle('tagPanelEmpty', isEmpty);

  panel.classList.remove('hasMoreTags');

  if (isEmpty) {
    button.hidden = true;
    scheduleTagScrollStripRefresh();
    return;
  }

  var needsMore = renderedTagCount < availableTags.length;
  if (!needsMore) {
    var pillHeight = parseFloat(
      window.getComputedStyle(panel).getPropertyValue('--tag-pill-height')
    ) || 29;
    needsMore = tagList.scrollHeight > pillHeight + 1;
  }

  var shouldShowButton = needsMore || wasExpanded;

  panel.classList.toggle('hasMoreTags', shouldShowButton);
  button.hidden = !shouldShowButton;
  button.textContent = wasExpanded ? 'Less' : 'More';
  button.setAttribute('aria-expanded', wasExpanded ? 'true' : 'false');
  scheduleTagScrollStripRefresh();
}

function setURLParams(newParams, options) {
  options = options || {};
  var push = options.push !== undefined ? options.push : true;
  var arraySep = options.arraySep || ',';
  var sp = new URLSearchParams(window.location.search);

  Object.entries(newParams).forEach(function(entry) {
    var k = entry[0];
    var v = entry[1];

    if (v === null || v === undefined || v === '') {
      sp.delete(k);
    } else if (Array.isArray(v)) {
      if (v.length === 0)
        sp.delete(k);
      else
        sp.set(k, v.join(arraySep));
    } else {
      sp.set(k, String(v));
    }
  });

  var qs = sp.toString();
  var hash = window.location.hash || '';
  var path = window.location.pathname || '';
  var nextUrl = path + (qs ? '?' + qs : '') + hash;

  window.history[push ? 'pushState' : 'replaceState']({}, '', nextUrl);
}

function getURLParam(name, options) {
  options = options || {};
  var asArray = options.asArray || false;
  var delimiter = options.delimiter || ',';
  var params = new URLSearchParams(window.location.search);
  var raw = params.get(name);
  if (raw === null)
    return asArray ? [] : null;
  return asArray ? raw.split(delimiter).filter(function(s) { return s.length; }) : raw;
}

function grabTagsFromURL() {
  globalTags = getURLParam('tags', { asArray: true });
}

function grabSearchFromURL() {
  var inputEl = document.getElementById('searchInput');
  var sp = new URLSearchParams(window.location.search);
  var q = sp.get('q');
  inputEl.value = q || '';
  refreshClearSearchButton();
}

function normalizeURLValue(urlValue) {
  if (!urlValue)
    return null;

  try {
    return new window.URL(urlValue, window.location.href).href;
  } catch (error) {
    return null;
  }
}

function grabSelectedResultFromURL() {

  selectedResultIndex = -1;
}

  panel.hidden = !shouldOpen;

  button.setAttribute('aria-label', shouldOpen ? 'Close menu' : 'Open menu');

function initMainMenu() {
  var menu = document.getElementById('mainMenu');
  var button = document.getElementById('mainButton');
  var panel = document.getElementById('mainMenuPanel');
  var openRandomButton = document.getElementById('openRandomButton');

  button.addEventListener('click', function() {
    var shouldOpen = button.getAttribute('aria-expanded') !== 'true';
    setMainMenuOpen(shouldOpen, shouldOpen);
  });

  button.addEventListener('keydown', function(event) {
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      setMainMenuOpen(true, true);
    }
  });

  openRandomButton.addEventListener('click', function() {
    setMainMenuOpen(false, false);
    openRandomResult();
  });

  panel.addEventListener('keydown', function(event) {
    var items = Array.prototype.slice.call(
      panel.querySelectorAll('[role="menuitem"]:not([disabled])')
    );
    var currentIndex = items.indexOf(document.activeElement);

    if (items.length === 0)
      return;

    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      var direction = event.key === 'ArrowDown' ? 1 : -1;
      if (currentIndex === -1)
        currentIndex = direction === 1 ? -1 : 0;
      items[(currentIndex + direction + items.length) % items.length].focus();
    } else if (event.key === 'Home') {
      event.preventDefault();
      items[0].focus();
    } else if (event.key === 'End') {
      event.preventDefault();
      items[items.length - 1].focus();
    }
  });

  document.addEventListener('click', function(event) {
    if (!menu.contains(event.target))
      setMainMenuOpen(false, false);
  });

  menu.addEventListener('focusout', function(event) {
    if (!menu.contains(event.relatedTarget))
      setMainMenuOpen(false, false);
  });

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape' || button.getAttribute('aria-expanded') !== 'true')
      return;

    event.preventDefault();
    setMainMenuOpen(false, false);
    button.focus();
  });
}

function openRandomResult() {
  if (globalResults.length === 0)
    return false;

  var randomIndex = Math.floor(Math.random() * globalResults.length);
  var randomResult = globalResults[randomIndex];
  if (!randomResult || !randomResult.document || !randomResult.document.url)
    return false;

  window.location.href = randomResult.document.url;
  return true;
}

function createHtmlFragment(startIndex, endIndex, getHtml) {
  var html = '';

  for (var i = startIndex; i < endIndex; i++)
    html += getHtml(i);

  var template = document.createElement('template');
  template.innerHTML = html;
  return template.content;
}

function createResultFragment(startIndex, endIndex) {
  return createHtmlFragment(startIndex, endIndex, function(index) {
    return getResultString(globalResults[index].document, index);
  });
}

function replaceRenderedResults(endIndex) {
  var ul = document.getElementById('results');
  ul.replaceChildren(createResultFragment(0, endIndex));
  renderedResultCount = endIndex;
}

function appendRenderedResults(endIndex) {
  if (endIndex <= renderedResultCount)
    return;

  document.getElementById('results').appendChild(
    createResultFragment(renderedResultCount, endIndex)
  );
  renderedResultCount = endIndex;
}

function finishResultRender(generation) {
  if (generation !== progressiveRenderGeneration)
    return;

  document.getElementById('results').removeAttribute('aria-busy');
}

function scheduleNextProgressiveBatch(generation) {
  if (generation !== progressiveRenderGeneration || progressiveRenderJobs.length === 0)
    return;

  var renderNext = function() {
    progressiveRenderIdleHandle = null;
    progressiveRenderTimeoutHandle = null;

    if (generation !== progressiveRenderGeneration)
      return;

    var job = progressiveRenderJobs.shift();

    if (!job.isDone())
      job.renderNext();

    if (job.isDone()) {
      if (job.finish)
        job.finish();
    } else {
      progressiveRenderJobs.push(job);
    }

    scheduleNextProgressiveBatch(generation);
  };

  if (typeof requestIdleCallback === 'function') {
    progressiveRenderIdleHandle = requestIdleCallback(renderNext, { timeout: 100 });
  } else {
    progressiveRenderTimeoutHandle = setTimeout(renderNext, 0);
  }
}

function ensureResultRendered(index) {
  if (index < renderedResultCount || index < 0 || index >= globalResults.length)
    return index >= 0 && index < renderedResultCount;

  appendRenderedResults(Math.min(
    globalResults.length,
    Math.max(index + 1, renderedResultCount + RESULT_BATCH_SIZE)
  ));

  if (renderedResultCount >= globalResults.length)
    finishResultRender(progressiveRenderGeneration);

  return index < renderedResultCount;
}

function updateResults(shouldRecordHistory, updateFromSearchInput, renderWithoutIndex) {
  if (updateFromSearchInput === undefined)
    updateFromSearchInput = false;
  if (renderWithoutIndex === undefined)
    renderWithoutIndex = false;

  cancelScheduledSearchInputUpdate();
  var renderGeneration = cancelProgressiveRenderWork();

  if (!activeSearch)
    return;

  var ul = document.getElementById('results');
  ul.setAttribute('aria-busy', 'true');
  var previousSelectedIndex = updateFromSearchInput ? -1 : selectedResultIndex;
  var previousSelectedUrl = updateFromSearchInput ? null : selectedResultUrl;

  if (updateFromSearchInput) {
    selectedResultIndex = -1;
    selectedResultUrl = null;
    setURLParams({ selected: null }, { push: false });
  }

  var inputElement = document.getElementById('searchInput');
  var rawInput = inputElement.value;
  var inputStr = rawInput.trim();
  var filterStrings = inputStr.split(' ');

  for (var i = 0; i < filterStrings.length; i++) {
    var next = filterStrings[i];

    if (!next || next[next.length - 1] != ':')
      continue;

    filterStrings.splice(i, 1);
    i--;

    globalTags.push(next.replace(':', '').toLowerCase());
    shouldRecordHistory = true;
  }

  var anyTags = globalTags.length > 0;
  var forceNewest = rawInput.length == 0 && !anyTags;
  var searchTextToDisplay = filterStrings.join(' ');

  if (rawInput.endsWith(' ') && searchTextToDisplay.length > 0)
    searchTextToDisplay += ' ';

  inputElement.value = searchTextToDisplay;

  var searchSansTags = filterStrings.join(' ').trim();
  var hasActiveQuery = searchSansTags.length > 0 || anyTags;
  var quotedPhrases = getQuotedSearchPhrases(searchSansTags);
  var scoredArr;

  if (!miniSearch && renderWithoutIndex) {
    anyTags = false;
    forceNewest = true;
    searchSansTags = '';
    quotedPhrases = [];
  } else if (!miniSearch && searchSansTags) {
    ul.removeAttribute('aria-busy');
    updateSearchPills(shouldRecordHistory);

    if (updateFromSearchInput) {
      clearTimeout(updateSearchTextHistoryTimer);
      updateSearchTextHistoryTimer = setTimeout(function() {
        setURLParams({ q: searchTextToDisplay }, { push: true });
      }, 500);
    }

    document.getElementById('mainButton').classList.toggle('mainDropdownIdleAnim', hasActiveQuery);
    return;
  }

  if (!searchSansTags) {
    scoredArr = searchDocuments
      .filter(function(document) {
        return !anyTags || documentHasTags(document, globalTags);
      })
      .map(function(document) {
        return {
          document: document,
          score: 0,
          timestamp: document.timestamp
        };
      });
  } else {
    scoredArr = miniSearch.search(searchSansTags, {
      boost: {
        name: 8,
        description: 4,
        categories: 3,
        keywords: 1
      },
      prefix: function(term) {
        return Array.from(term).length >= 2;
      },
      fuzzy: function(term) {
        return getFuzzyDistance(term);
      },
      weights: {
        fuzzy: 0.65,
        prefix: 0.85
      },
      combineWith: 'OR',
      filter: function(result) {
        var document = searchDocuments[result.id];
        return document &&
          (!anyTags || documentHasTags(document, globalTags)) &&
          documentMatchesPhrases(document, quotedPhrases);
      }
    }).map(function(result) {
      var document = searchDocuments[result.id];
      return {
        document: document,
        score: result.score,
        timestamp: document.timestamp,
        match: result.match,
        terms: result.terms
      };
    });
  }

  var mode = forceNewest ? SORTING_NEWEST : parseInt(sortingMode);
  if (mode === SORTING_RELEVANCE) {
    scoredArr.sort(function(x, y) { return y.score - x.score; });
  } else if (mode === SORTING_NEWEST) {
    scoredArr.sort(function(x, y) {
      if (x.timestamp === y.timestamp)
        return y.score - x.score;
      return y.timestamp - x.timestamp;
    });
  } else if (mode === SORTING_OLDEST) {
    scoredArr.sort(function(x, y) {
      if (x.timestamp === y.timestamp)
        return y.score - x.score;
      return x.timestamp - y.timestamp;
    });
  } else {
    scoredArr.sort(function(x, y) { return y.score - x.score; });
  }

  globalResults.length = 0;
  globalCategoryMap.clear();

  scoredArr.forEach(function(scoredMatch) {
    if (!scoredMatch || !scoredMatch.document)
      return;

    globalResults.push(scoredMatch);
    addTag(scoredMatch.document, globalCategoryMap);
  });

  var initialResultCount = globalResults.length <= INITIAL_RESULT_BATCH_SIZE
    ? globalResults.length
    : INITIAL_RESULT_BATCH_SIZE;

  replaceRenderedResults(initialResultCount);
  restoreSelectedResult(previousSelectedUrl, previousSelectedIndex);
  prepareTagRender();

  if (renderedResultCount < globalResults.length) {
    progressiveRenderJobs.push({
      isDone: function() {
        return renderedResultCount >= globalResults.length;
      },
      renderNext: function() {
        appendRenderedResults(
          Math.min(renderedResultCount + RESULT_BATCH_SIZE, globalResults.length)
        );
      },
      finish: function() {
        finishResultRender(renderGeneration);
      }
    });
  } else {
    finishResultRender(renderGeneration);
  }

  if (renderedTagCount < availableTags.length) {
    progressiveRenderJobs.push({
      isDone: function() {
        return renderedTagCount >= availableTags.length;
      },
      renderNext: function() {
        appendRenderedTags(
          Math.min(renderedTagCount + TAG_BATCH_SIZE, availableTags.length)
        );
      },
      finish: function() {
        finishTagRender(renderGeneration);
      }
    });
  }

  scheduleNextProgressiveBatch(renderGeneration);

  updateSearchPills(shouldRecordHistory);

  if (updateFromSearchInput) {
    clearTimeout(updateSearchTextHistoryTimer);
    updateSearchTextHistoryTimer = setTimeout(function() {
      setURLParams({ q: searchTextToDisplay }, { push: true });
    }, 500);
  }

  document.getElementById('mainButton').classList.toggle('mainDropdownIdleAnim', hasActiveQuery);
  showModalBar(globalResults.length > 1 && !forceNewest);

  if (!/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
    inputElement.focus();
}

function getResultElements() {
  return Array.prototype.slice.call(document.querySelectorAll('#results .resultItem'));
}

function syncSelectedResultUI() {
  var resultElements = getResultElements();
  var inputElement = document.getElementById('searchInput');

  resultElements.forEach(function(element, index) {
    var isSelected = index === selectedResultIndex;
    element.classList.toggle('is-selected', isSelected);
  });

  if (selectedResultIndex >= 0 && selectedResultIndex < resultElements.length)
    inputElement.setAttribute('aria-activedescendant', resultElements[selectedResultIndex].id);
  else
    inputElement.removeAttribute('aria-activedescendant');
}

function clearSelectedResult() {
  selectedResultIndex = -1;
  selectedResultUrl = null;
  syncSelectedResultUI();
  setURLParams({ selected: null }, { push: false });
}

function scrollSelectedResultIntoView(element, options) {
  if (!element)
    return;

  options = options || {};
  var header = document.getElementById('appHeader');
  var headerHeight = header ? header.offsetHeight : 0;
  var viewportHeight = window.innerHeight || document.documentElement.clientHeight;
  var topPadding = 8;
  var bottomPadding = 8;
  var rect = element.getBoundingClientRect();
  var currentScrollY = window.scrollY || window.pageYOffset;
  var visibleTop = headerHeight + topPadding;
  var visibleBottom = viewportHeight - bottomPadding;
  var targetScrollY;
  var alignTop = options.alignTop === true;

  if (alignTop) {
    targetScrollY = currentScrollY + rect.top - visibleTop;
    window.scrollTo(0, Math.max(0, Math.round(targetScrollY)));
    return;
  }

  if (rect.height >= visibleBottom - visibleTop) {
    targetScrollY = currentScrollY + rect.top - visibleTop;
    window.scrollTo(0, Math.max(0, Math.round(targetScrollY)));
    return;
  }

  if (rect.top < visibleTop) {
    targetScrollY = currentScrollY + rect.top - visibleTop;
    window.scrollTo(0, Math.max(0, Math.round(targetScrollY)));
    return;
  }

  if (rect.bottom > visibleBottom) {
    targetScrollY = currentScrollY + rect.bottom - visibleBottom;
    window.scrollTo(0, Math.max(0, Math.round(targetScrollY)));
  }
}

function setSelectedResultIndex(index, options) {
  options = options || {};
  var shouldScroll = options.scroll !== false;
  var shouldPushHistory = options.pushHistory !== false;
  var shouldAlignTop = options.alignTop === true;

  if (index < 0 || index >= globalResults.length || !ensureResultRendered(index)) {
    clearSelectedResult();
    return false;
  }

  var element = document.getElementById('result-item-' + index);
  if (!element) {
    clearSelectedResult();
    return false;
  }

  selectedResultIndex = index;
  var primaryLink = element.querySelector('.resultPrimaryLink');
  selectedResultUrl = primaryLink ? (primaryLink.getAttribute('href') || primaryLink.href) : null;
  syncSelectedResultUI();
  setURLParams({ selected: selectedResultUrl }, { push: shouldPushHistory });

  if (shouldScroll)
    scrollSelectedResultIntoView(element, { alignTop: shouldAlignTop });

  return true;
}

function restoreSelectedResult(previousSelectedUrl, previousSelectedIndex) {
  if (globalResults.length == 0) {
    clearSelectedResult();
    return;
  }

  if (previousSelectedUrl) {
    var normalizedPreviousSelectedUrl = normalizeURLValue(previousSelectedUrl);

    for (var i = 0; i < globalResults.length; i++) {
      var currentResultRawUrl = globalResults[i].document.url;
      var currentResultUrl = normalizeURLValue(currentResultRawUrl);

      if (currentResultRawUrl === previousSelectedUrl || (currentResultUrl && normalizedPreviousSelectedUrl && currentResultUrl === normalizedPreviousSelectedUrl)) {
        setSelectedResultIndex(i, {
          scroll: shouldScrollSelectedResultOnInitialLoad,
          pushHistory: false,
          alignTop: shouldScrollSelectedResultOnInitialLoad
        });
        shouldScrollSelectedResultOnInitialLoad = false;
        return;
      }
    }

    shouldScrollSelectedResultOnInitialLoad = false;
    clearSelectedResult();
    return;
  }

  if (previousSelectedIndex >= 0) {
    setSelectedResultIndex(Math.min(previousSelectedIndex, resultElements.length - 1), { scroll: false, pushHistory: false });
    shouldScrollSelectedResultOnInitialLoad = false;
    return;
  }

  shouldScrollSelectedResultOnInitialLoad = false;
  clearSelectedResult();
}

function moveSelectedResult(delta) {
  var resultCount = globalResults.length;

  if (resultCount == 0)
    return false;

  if (selectedResultIndex === -1)
    return setSelectedResultIndex(delta >= 0 ? 0 : resultCount - 1);

  var nextIndex = (selectedResultIndex + delta + resultCount) % resultCount;
  return setSelectedResultIndex(nextIndex);
}

function openSelectedResult() {
  if (selectedResultIndex < 0 ||
      selectedResultIndex >= globalResults.length ||
      !ensureResultRendered(selectedResultIndex))
    return false;

  var selectedElement = document.getElementById('result-item-' + selectedResultIndex);
  var primaryLink = selectedElement
    ? selectedElement.querySelector('.resultPrimaryLink')
    : null;
  if (!primaryLink)
    return false;

  window.location.href = primaryLink.href;
  return true;
}

function getResultString(document, resultIndex) {
  if (!document)
    return '';

  if (document.resultBodyHtml !== undefined) {
    return '<li class="resultItem" id="result-item-' + resultIndex +
      '" data-result-index="' + resultIndex + '">' +
      document.resultBodyHtml + '</li>';
  }

  var urlValue = document.url;
  var name = document.name;
  var description = document.description;
  var category = document.categories;
  var timestamp = new Date(document.timestamp * 1000).toLocaleString(undefined, { dateStyle: 'medium' });
  var archiveUrl = document.archiveUrl;

  var embedInfo = tryGetEmbedHTML(urlValue);
  var extraButtonHtml = '';
  var extraContentHtml = '';

  if (embedInfo.success) {
    extraButtonHtml = embedInfo.buttonHtml;
    extraContentHtml = '<div class="extraResultContent" id="' + embedInfo.id + '"></div>';
  }

  var archiveLinkHtml = '';
  if (archiveUrl && archiveUrl !== 'MISSING_ARCHIVE_LINK' && archiveUrl !== 'SITE_NOT_ARCHIVABLE' &&
    (archiveUrl.startsWith('http://') || archiveUrl.startsWith('https://'))) {
    archiveLinkHtml = ' &middot; <a href="' + archiveUrl + '">archive</a>';
  }

  document.resultBodyHtml = '<b><a class="resultPrimaryLink" href="' + urlValue + '">' +
    name + '</a> ' + extraButtonHtml + '</b><br><small><sup>' + category +
    ' &middot; ' + timestamp + archiveLinkHtml + ' &middot; ' + urlValue +
    '</sup></small><br class="smallSpace">' + description + extraContentHtml;

  return '<li class="resultItem" id="result-item-' + resultIndex +
    '" data-result-index="' + resultIndex + '">' +
    document.resultBodyHtml + '</li>';
}

function stripParentheses(str, symbols) {
  symbols.forEach(function(x) {
    str = str.replaceAll(x, '');
  });

  return str;
}

function prepareAvailableTags() {
  if (allTags.size == 0) {
    searchDocuments.forEach(function(document) {
      addTag(document, allTags);
    });
  }

  var sortedKeys = new Array();

  allTags.forEach(function(value, key) {
    if (globalCategoryMap.size > 0 && !globalCategoryMap.has(key))
      return;

    if (globalCategoryMap.size > 0 && globalCategoryMap.get(key).val >= globalResults.length)
      return;

    var localCount = globalCategoryMap.size > 0 ? globalCategoryMap.get(key).val : value.val;
    sortedKeys.push({ name: key, count: localCount });
  });

  sortedKeys.sort(function(x, y) {
    return y.count - x.count;
  });

  sortedKeys.forEach(function(tag, index) {
    tag.color = setTagColor(tag.name, index / sortedKeys.length);
  });

  return globalResults.length == 1 ? [] : sortedKeys;
}

function createTagFragment(startIndex, endIndex) {
  return createHtmlFragment(startIndex, endIndex, function(index) {
    var tag = availableTags[index];
    return getTagLinkHtml(tag.name + ':', tag.name, String(tag.count), tag.color) + ' ';
  });
}

function replaceRenderedTags(endIndex) {
  document.getElementById('tagBox').replaceChildren(createTagFragment(0, endIndex));
  renderedTagCount = endIndex;
}

function appendRenderedTags(endIndex) {
  if (endIndex <= renderedTagCount)
    return;

  document.getElementById('tagBox').appendChild(
    createTagFragment(renderedTagCount, endIndex)
  );
  renderedTagCount = endIndex;
}

function prepareTagRender() {
  var panel = document.getElementById('tagPanel');
  var renderAllTags = panel.classList.contains('tagPanelExpanded');
  availableTags = prepareAvailableTags();
  replaceRenderedTags(
    renderAllTags
      ? availableTags.length
      : Math.min(INITIAL_TAG_BATCH_SIZE, availableTags.length)
  );

  if (availableTags.length === 0 && renderAllTags)
    setTagPanelExpanded(false);

  refreshTagMoreButton();
}

function finishTagRender(generation) {
  if (generation !== progressiveRenderGeneration)
    return;

  refreshTagMoreButton();
}

function addTag(document, tagMap) {
  document.categoryList.forEach(function(tag) {
    if (!tag)
      return;

    if (tagMap.has(tag))
      tagMap.get(tag).val++;
    else
      tagMap.set(tag, { val: 1 });
  });
}

function setTagColor(tag, color01) {
  var a = [0.5, 0.5, 0.5];
  var b = [0.5, 0.2, 0.3];
  var c = [1.0, 1.0, 1.0];
  var d = [0.0, 0.3, 0.6];
  var bgColor01 = cosinePalette(color01, a, b, c, d);
  var bgColor = (bgColor01[0] * 255) + ' ' + (bgColor01[1] * 255) + ' ' + (bgColor01[2] * 255);

  if (tagColorMap.has(tag))
    tagColorMap.get(tag).color = bgColor;
  else
    tagColorMap.set(tag, { color: bgColor });

  return bgColor;
}

function getTagLinkHtml(urlValue, text, suffix, bgColor) {
  return '<a href="' + urlValue + '" class="tagLink" style="background-color: rgb(' + bgColor + ');" onclick="return resultOnClick(this)">' + text + '<span class="tagCounter">' + suffix + '</span></a>';
}

function cosinePalette(col01, a, b, c, d) {
  return [
    a[0] + b[0] * Math.cos(6.28318 * (c[0] * col01 + d[0])),
    a[1] + b[1] * Math.cos(6.28318 * (c[1] * col01 + d[1])),
    a[2] + b[2] * Math.cos(6.28318 * (c[2] * col01 + d[2]))
  ];
}

function updateSearchPills(shouldRecordHistory) {
  var doc = document.getElementById('searchContainerId');

  while (doc.firstChild) {
    doc.removeChild(doc.firstChild);
  }

  globalTags.forEach(function(x) {
    var bgColor = '230, 230, 230';

    if (tagColorMap.has(x))
      bgColor = tagColorMap.get(x).color;

    doc.insertAdjacentHTML('beforeend', getSearchPillHtml(x, bgColor));
  });

  refreshClearSearchButton();

  if (shouldRecordHistory)
    setURLParams({ tags: globalTags }, { push: true });
}

function getSearchPillHtml(tag, bgColor) {
  return '<button class="tagSearchPill" onclick="onTagSearchPillClick(this)" style="background-color: rgb(' + bgColor + ');">' + tag + ' &times;</button>';
}

function resultOnClick(arg) {
  var searchString = document.getElementById('searchInput').value;
  searchString = arg.getAttribute('href') + ' ' + searchString;
  document.getElementById('searchInput').value = searchString;
  updateResults(true);
  return false;
}

function onTagSearchPillClick(button) {
  var tag = button.textContent.split(' ')[0];
  var index = globalTags.indexOf(tag);

  if (index == -1)
    return;

  globalTags.splice(index, 1);
  updateResults(true);
}

function onGlobalShortcutKeyDown(event) {
  var key = event.key;

  if (event.ctrlKey && !event.altKey && !event.metaKey && key === 'ArrowDown') {
    event.preventDefault();
    moveSelectedResult(1);
    return;
  }

  if (event.ctrlKey && !event.altKey && !event.metaKey && key === 'ArrowUp') {
    event.preventDefault();
    moveSelectedResult(-1);
    return;
  }

  if (key === 'Enter' && event.ctrlKey) {
    if (selectedResultIndex !== -1) {
      event.preventDefault();
      openSelectedResult();
      return;
    }

    var rawInput = document.getElementById('searchInput').value;

    if (rawInput.length > 0)
      window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(rawInput);
  }
}

function onSearchInputKeyDown(event) {
  var key = event.key;
  var refreshResults = false;

  if (key === 'Escape' && selectedResultIndex !== -1) {
    event.preventDefault();
    clearSelectedResult();
    return;
  }

  if (key === 'Enter' && selectedResultIndex !== -1) {
    event.preventDefault();
    openSelectedResult();
    return;
  }

  if (key === 'Backspace') {
    var hasTextSelection = event.target.selectionStart !== event.target.selectionEnd;
    var shouldDelete = !hasTextSelection &&
      event.target.selectionStart == 0 &&
      globalTags.length > 0;

    if (shouldDelete) {
      event.preventDefault();
      globalTags.length = Math.max(globalTags.length - 1, 0);
      refreshResults = true;
    }
  }

  if (refreshResults)
    updateResults(true);
}

function tryGetEmbedHTML(urlValue) {
  if (urlValue.includes('youtu.be')) {
    var shortVideoId = urlValue.split('be/')[1];
    return {
      success: true,
      buttonHtml: '<button type="button" class="videoButton" value="' + shortVideoId + '" onClick="videoPopup(this)">&#x1F4FA;</button>',
      id: shortVideoId
    };
  }

  if (urlValue.includes('youtube.com/playlist')) {
    var playlistBits = urlValue.split('list=')[1].split('&si=');
    var playlistId = playlistBits[0];
    var playlistVideoId = playlistBits[1];
    return {
      success: true,
      buttonHtml: '<button type="button" class="videoButton" value="' + playlistVideoId + '@' + playlistId + '" onClick="videoPopup(this)">&#x1F4FA;</button>',
      id: playlistVideoId + '@' + playlistId
    };
  }

  if (urlValue.includes('youtube.com/watch')) {
    var queryBits = urlValue.split('v=')[1];
    var queryParts = queryBits.split('&list=');
    var watchVideoId = queryParts[0];
    var watchPlaylistId = queryParts[1];

    if (watchPlaylistId) {
      return {
        success: true,
        buttonHtml: '<button type="button" class="videoButton" value="' + watchVideoId + '@' + watchPlaylistId + '" onClick="videoPopup(this)">&#x1F4FA;</button>',
        id: watchVideoId + '@' + watchPlaylistId
      };
    }

    return {
      success: true,
      buttonHtml: '<button type="button" class="videoButton" value="' + watchVideoId + '" onClick="videoPopup(this)">&#x1F4FA;</button>',
      id: watchVideoId
    };
  }

  return { success: false };
}

function videoPopup(idOwnerElement) {
  var element = document.getElementById(idOwnerElement.value);

  if (element.childNodes.length > 0)
    return;

  var valueParts = idOwnerElement.value.split('@');
  var videoId = valueParts[0];
  var playlist = valueParts[1];
  var html = '';

  if (playlist) {
    html = '<button class="videoCloseButton" value="' + idOwnerElement.value + '" onClick="videoClose(this)"><b>&times;&nbsp;&nbsp;</b></button><div class="videoModal">' + getPlaylistHtml(playlist, videoId) + '</div>';
  } else {
    html = '<button class="videoCloseButton" value="' + idOwnerElement.value + '" onClick="videoClose(this)"><b>&times;&nbsp;&nbsp;</b></button><div class="videoModal">' + getSingleVideoHtml(videoId) + '</div>';
  }

  element.insertAdjacentHTML('afterbegin', html);
  element.classList.toggle('videoShowAnim', true);
}

function videoClose(idOwnerElement) {
  var element = document.getElementById(idOwnerElement.value);
  element.classList.toggle('videoShowAnim', false);

  while (element.firstChild) {
    element.removeChild(element.firstChild);
  }
}

function getPlaylistHtml(playlistId, videoId) {
  return '<iframe src="https://www.youtube.com/embed/videoseries?si=' + videoId + '&amp;list=' + playlistId + '" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
}

function getSingleVideoHtml(videoId) {
  return '<iframe src="https://www.youtube.com/embed/' + videoId + '" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
}
